# Safe default: report available updates without changing anything.
policy = "notify"

check_core = true
check_plugins = true
startup_check = true

# Human durations support s, m, h, d, and combinations such as 1h30m.
check_interval = "6h"
catalog_refresh_interval = "30m"
fleet_sync_interval = "6h"
initial_delay = "5m"
jitter = "5m"

# Optional local-time quiet window. Overnight windows are supported.
# quiet_hours = "22:00-07:00"

# Scheduled fleet reconciliation is opt-in. Syncing the non-secret updater
# settings is a separate opt-in because remote hosts may need local policy.
scheduled_fleet_sync = false
sync_update_settings = false

# Only an installed commit that is behind its upstream branch may update.
require_fast_forward = true
immutable_pins = true

# Core protocol changes need a staged fleet rollout or an explicit CLI flag.
allow_protocol_change = false

# herdr.dev/latest.json describes the stable channel. A client tracking any
# other channel is compared against a manifest that does not describe it, which
# is held. Set this only if you know latest.json covers your channel.
allow_channel_mismatch = false

# Empty means all GitHub sources are eligible. Narrow these for auto mode.
# allow = ["diegopzz/herdr-*"]
# trusted_owners = ["diegopzz"]

# Parallel hosts during `fleet` and `sync`, and parallel plugin inspections.
max_concurrency = 8

# How long a resolved branch/tag may be reused before it is looked up again.
# Only this half of the cache can go stale, and its worst case is a *delayed*
# update, never a wrong one: `apply`, `rollback`, `resume`, and `--refresh` all
# re-resolve unconditionally. Commit-to-commit comparisons are cached
# separately and never expire, because the ancestry between two immutable SHAs
# cannot change. Set "0s" to disable ref caching entirely.
ref_cache_ttl = "15m"

# Unrecognised keys in this file are not silently ignored. A key close to a
# real one (`trusted_owner`, `polciy`) is an error naming the key you meant,
# because it would otherwise change the safety posture without changing a line
# of output. A key resembling nothing known only warns, so a host running an
# older build mid-rollout does not fail on a newer build's setting.
