[package]
name = "herdr-updater"
version = "0.4.0"
edition = "2021"
# Verified by the MSRV job in CI, not asserted. 1.74 was declared and never
# checked; it has not built since a transitive dependency moved to edition
# 2024, which needs Cargo 1.85. Lowering this again means pinning those
# dependencies back, deliberately.
rust-version = "1.85"
description = "Update Herdr safely with a plugin store, fleet sync, schedules, and rollback"
repository = "https://github.com/diegopzz/herdr-updater"
license = "MIT"
readme = "README.md"
keywords = ["herdr", "updater", "fleet", "plugins"]
categories = ["command-line-utilities"]

[[bin]]
name = "herdr-updater"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
