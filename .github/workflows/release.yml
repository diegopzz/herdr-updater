name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: herdr-updater
          # Fleets run on ARM Linux — Raspberry Pi, Ampere and Graviton hosts,
          # ARM Windows under WSL. Without this artifact the launcher exits 2
          # with "no prebuilt binary" and the plugin simply cannot be installed
          # there, which is a strange gap for a tool whose job is fleet drift.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: herdr-updater
          - os: macos-15-intel
            target: x86_64-apple-darwin
            executable: herdr-updater
          - os: macos-14
            target: aarch64-apple-darwin
            executable: herdr-updater
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: herdr-updater.exe
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 2
          fi
          tag_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          package="$RUNNER_TEMP/package"
          mkdir -p "$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$package/${{ matrix.executable }}"
          tar -C "$package" -czf "herdr-updater-$version-${{ matrix.target }}.tar.gz" "${{ matrix.executable }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.target }}
          path: herdr-updater-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance is signed with a short-lived OIDC identity; both are needed
      # and neither is inherited from the workflow-level `contents: write`.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Create checksums
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $lines = Get-ChildItem -LiteralPath dist -Filter 'herdr-updater-*.tar.gz' |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant(), $_.Name }
          $lines | Set-Content -LiteralPath "dist/checksums-$version.txt" -Encoding utf8NoBOM
      # A checksum proves the archive was not altered in transit. It says
      # nothing about where the archive came from, which is the question that
      # matters when the launcher downloads and executes it on first use.
      # Attestation binds each artifact to this workflow, this repository and
      # this commit, verifiable with `gh attestation verify`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/herdr-updater-*.tar.gz

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist | Sort-Object Name | ForEach-Object FullName
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes --title $env:RELEASE_TAG @assets
