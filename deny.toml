# Policy for `cargo deny`, run on the same schedule as `cargo audit`.
#
# The dependency list is deliberately four crates wide (crossterm, serde,
# serde_json, toml) because release artifacts have to stay small enough to
# download on a plugin's first use. This file exists to keep that true, and to
# make a licence change in the tree something a person has to approve.

[licenses]
# Permissive only. This binary is downloaded and executed by the plugin
# launcher; a copyleft obligation arriving through a transitive dependency
# should be a decision, not a surprise.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two copies of the same crate is usually a lockfile that drifted, and it costs
# binary size in a project whose whole install story is a small download.
multiple-versions = "warn"
wildcards = "deny"

[advisories]
# Advisories are `cargo audit`'s job in the neighbouring workflow; keeping them
# out of here means one signal per problem instead of two.
yanked = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
