[package]
name = "herdr-updater"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Keep herdr and its plugins current across a whole fleet, not just one host"
repository = "https://github.com/diegopzz/herdr-updater"
license = "MIT"
readme = "README.md"
keywords = ["herdr", "updater", "fleet", "plugins"]
categories = ["command-line-utilities"]

[[bin]]
name = "herdr-updater"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"
panic = "abort"
