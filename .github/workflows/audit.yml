name: Audit

# Dependency advisories are checked on their own schedule rather than on every
# pull request. An advisory published against a transitive dependency has
# nothing to do with the change under review, and a red CI on an unrelated PR
# is how a security signal gets trained into background noise. This runs
# weekly, on changes to the dependency set, and on demand.
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the locked dependency tree
        run: cargo audit --deny warnings
