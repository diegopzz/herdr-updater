id = "herdr-updater"
name = "Herdr Updater"
version = "0.2.0"
min_herdr_version = "0.8.2"
description = "Update Herdr safely with a plugin store, fleet sync, schedules, drift checks, and rollback"
platforms = ["linux", "macos", "windows"]

[[build]]
platforms = ["linux", "macos"]
command = ["sh", "scripts/install-cli.sh"]

[[build]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "scripts/install-cli.ps1"]

[[startup]]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "startup"]

[[startup]]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "startup"]

[[actions]]
id = "check"
title = "Check Herdr and plugin updates"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "check"]

[[actions]]
id = "plan"
title = "Plan Herdr and plugin updates"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "plan"]

[[actions]]
id = "apply"
title = "Apply safe Herdr and plugin updates"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "apply"]

[[actions]]
id = "doctor"
title = "Diagnose the Herdr updater"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "doctor"]

[[actions]]
id = "fleet"
title = "Check Herdr fleet drift"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "fleet"]

[[actions]]
id = "open-store"
title = "Browse and install Herdr plugins"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "open-store"]

[[actions]]
id = "sync-plan"
title = "Plan plugin sync across connected hosts"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "sync", "plan"]

[[actions]]
id = "schedule-status"
title = "Show Herdr update schedule"
contexts = ["workspace"]
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "schedule", "status"]

[[actions]]
id = "check-windows"
title = "Check Herdr and plugin updates"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "check"]

[[actions]]
id = "plan-windows"
title = "Plan Herdr and plugin updates"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "plan"]

[[actions]]
id = "apply-windows"
title = "Apply safe Herdr and plugin updates"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "apply"]

[[actions]]
id = "doctor-windows"
title = "Diagnose the Herdr updater"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "doctor"]

[[actions]]
id = "fleet-windows"
title = "Check Herdr fleet drift"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "fleet"]

[[actions]]
id = "open-store-windows"
title = "Browse and install Herdr plugins"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "open-store"]

[[actions]]
id = "sync-plan-windows"
title = "Plan plugin sync across connected hosts"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "sync", "plan"]

[[actions]]
id = "schedule-status-windows"
title = "Show Herdr update schedule"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "schedule", "status"]

[[panes]]
id = "store"
title = "Herdr Plugin Store"
placement = "popup"
width = "90%"
height = "80%"
platforms = ["linux", "macos"]
command = ["sh", "bin/herdr-updater", "store"]

[[panes]]
id = "store-windows"
title = "Herdr Plugin Store"
placement = "popup"
width = "90%"
height = "80%"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "bin/herdr-updater.ps1", "store"]
